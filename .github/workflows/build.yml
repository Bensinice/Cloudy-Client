name: Cloudy bauen
# Baut bei jedem Hochladen (Push) automatisch die fertigen Dateien und legt sie unter "Releases" ab.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  client:
    runs-on: ubuntu-latest
    continue-on-error: true   # Falls die Client-Mod nicht baut, entstehen die Programme trotzdem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.12 }
      - run: cd client-src && gradle build --no-daemon
      - run: cp client-src/build/libs/cloudy-client-1.2.0.jar cloudy-client.jar
      - uses: actions/upload-artifact@v4
        with: { name: cloudy-client, path: cloudy-client.jar }
  windows:
    needs: client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: cloudy-client, path: client }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx electron-builder --win nsis portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "dist/Cloudy-*.exe" }
  mac:
    needs: client
    strategy:
      matrix:
        include:
          - { os: macos-15,       arch: arm64, jre: aarch64 }
          - { os: macos-15-intel, arch: x64,   jre: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: cloudy-client, path: client }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Java 21 mitliefern
        run: |
          mkdir jre
          curl -L "https://api.adoptium.net/v3/binary/latest/21/ga/mac/${{ matrix.jre }}/jre/hotspot/normal/eclipse" | tar xz -C jre --strip-components=1
          node -e "const f='package.json',p=require('./'+f);p.build.extraResources=[{from:'jre/Contents/Home',to:'java'}];require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
      - run: npm install
      - run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with: { name: "mac-${{ matrix.arch }}", path: "dist/*.dmg" }
  linux:
    needs: client
    runs-on: ubuntu-latest
    continue-on-error: true   # Linux ist neu: ein Fehler hier darf den Windows/Mac-Release nie verhindern
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: cloudy-client, path: client }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx electron-builder --linux AppImage --x64 --publish never
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: "dist/*.AppImage" }
  release:
    needs: [windows, mac, linux]
    if: always() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version aus package.json lesen
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: release, merge-multiple: true, pattern: "{windows,mac-*,linux}" }
      # Der Update-Knopf in Cloudy vergleicht diese Version (Tag v<Version>) mit der installierten.
      # Für ein neues Update: "version" in package.json erhöhen und hochladen.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Cloudy ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release/*
